server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nao anuncia a versao do Nginx no header nem nas paginas de erro.
    server_tokens off;

    # Cabecalhos de seguranca. Ver seguranca.conf para por que sao incluidos em
    # cada bloco em vez de declarados so aqui.
    include /etc/nginx/seguranca.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy da API. E o que coloca frontend e backend na mesma origem e elimina
    # a necessidade de CORS em producao.
    location /api/ {
        include /etc/nginx/seguranca.conf;

        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        # `$http_host` e nao `$host`: o primeiro preserva a porta enviada pelo
        # cliente. Com `$host`, o header Location devolvido no 201 saia como
        # `http://localhost/api/imoveis/13`, sem a porta 8080.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Exportacao de GeoJSON grande pode demorar; o timeout padrao de 60s
        # cortaria o download no meio.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Assets com hash no nome podem ser cacheados para sempre: um novo build
    # gera um nome novo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        include /etc/nginx/seguranca.conf;

        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index nunca e cacheado: e ele que aponta para os assets novos.
    location = /index.html {
        include /etc/nginx/seguranca.conf;

        add_header Cache-Control "no-store, must-revalidate";
    }

    # Fallback da SPA: qualquer rota do Angular (/imoveis/3/editar, /mapa)
    # precisa devolver o index para o roteador do cliente assumir.
    location / {
        include /etc/nginx/seguranca.conf;

        try_files $uri $uri/ /index.html;
    }
}
