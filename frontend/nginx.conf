server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nao anuncia a versao do Nginx no header nem nas paginas de erro.
    server_tokens off;

    # Cabecalhos de seguranca basicos. CSP restrita ao necessario: o mapa busca
    # tiles do OpenStreetMap, entao img-src precisa liberar esse host.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy da API. E o que coloca frontend e backend na mesma origem e elimina
    # a necessidade de CORS em producao.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Exportacao de GeoJSON grande pode demorar; o timeout padrao de 60s
        # cortaria o download no meio.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Assets com hash no nome podem ser cacheados para sempre: um novo build
    # gera um nome novo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index nunca e cacheado: e ele que aponta para os assets novos.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Fallback da SPA: qualquer rota do Angular (/imoveis/3/editar, /mapa)
    # precisa devolver o index para o roteador do cliente assumir.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
