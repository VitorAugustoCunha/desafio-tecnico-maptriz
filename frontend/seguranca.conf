# Cabeçalhos de segurança.
#
# Vivem num arquivo à parte por causa de uma regra do nginx que é fácil de
# errar: `add_header` de um bloco externo é herdado pelo interno APENAS se o
# interno não declarar nenhum `add_header` próprio. Como `location = /index.html`
# e o bloco de assets definem `Cache-Control`, eles descartavam silenciosamente
# todos os cabeçalhos de segurança do bloco `server` — justamente no documento
# principal, onde eles mais importam. Incluir este arquivo em cada bloco resolve
# sem depender de herança.
#
# Sobre os hosts de tile na CSP: o OpenLayers 10 usa
# `https://tile.openstreetmap.org` (domínio NU). Em CSP, `*.tile.openstreetmap.org`
# casa com subdomínios mas NÃO com o domínio base — listar só o curinga bloqueia
# todos os tiles, e o mapa fica em branco com apenas um aviso no console.
# `server.arcgisonline.com` serve a imagem aérea usada para contornar o lote.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://server.arcgisonline.com; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://server.arcgisonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
